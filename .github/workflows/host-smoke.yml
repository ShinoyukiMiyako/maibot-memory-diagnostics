name: host-smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  # 宿主迭代很快，插件没动时也要知道最新版还能不能加载。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 兼容范围两端，加上配置键变更（v1.3.16 把 webui.port 改成 http.port）之前的 1.3.x。
        tag: ["1.2.3", "1.3.8", "latest"]
    steps:
      - uses: actions/checkout@v7
      - name: Smoke
        run: bash tests/host_smoke.sh "sengokucola/maibot:${{ matrix.tag }}"
